name: RTG Experiment 001

on:
  push:
    paths:
      - "docs/EXPERIMENT_001_EPHEMERAL_CREDENTIAL_CORRIDOR.md"
      - "fixtures/experiment-001-ephemeral-credential-corridor.json"
      - "tests/test_experiment_001_ephemeral_credential_corridor.py"
      - "tools/run_experiment_001.py"
      - ".github/workflows/experiment-001-ephemeral-corridor.yml"
  pull_request:
    paths:
      - "docs/EXPERIMENT_001_EPHEMERAL_CREDENTIAL_CORRIDOR.md"
      - "fixtures/experiment-001-ephemeral-credential-corridor.json"
      - "tests/test_experiment_001_ephemeral_credential_corridor.py"
      - "tools/run_experiment_001.py"
      - ".github/workflows/experiment-001-ephemeral-corridor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-001:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Experiment 001
        run: python tests/test_experiment_001_ephemeral_credential_corridor.py

      - name: Generate deterministic result record
        run: python tools/run_experiment_001.py

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtg-experiment-001-results
          path: results/experiment-001-results.json
          if-no-files-found: error
