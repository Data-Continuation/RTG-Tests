name: RTG Experiment 003 Calibration Contract

on:
  pull_request:
    paths:
      - "registries/experiment-003-calibration-contract.json"
      - "tests/test_experiment_003_calibration_contract.py"
      - "docs/EXPERIMENT_003_CALIBRATION_CONTRACT.md"
      - ".github/workflows/experiment-003-calibration-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate locked calibration contract
        run: python tests/test_experiment_003_calibration_contract.py
